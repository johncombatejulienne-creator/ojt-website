<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- White background circle -->
  <circle cx="250" cy="250" r="248" fill="white" stroke="#1a1a1a" stroke-width="6"/>

  <!-- Outer ring (white band) -->
  <circle cx="250" cy="250" r="238" fill="white" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="250" cy="250" r="205" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Inner circle background -->
  <circle cx="250" cy="250" r="202" fill="#F97316"/>

  <!-- Four quadrants -->
  <!-- Top-left: darker orange -->
  <path d="M250,250 L250,48 A202,202 0 0,0 48,250 Z" fill="#F97316"/>
  <!-- Top-right: bright yellow -->
  <path d="M250,250 L250,48 A202,202 0 0,1 452,250 Z" fill="#FBBF24"/>
  <!-- Bottom-right: yellow -->
  <path d="M250,250 L452,250 A202,202 0 0,1 250,452 Z" fill="#FBBF24"/>
  <!-- Bottom-left: yellow -->
  <path d="M250,250 L250,452 A202,202 0 0,1 48,250 Z" fill="#FBBF24"/>

  <!-- Cross dividers -->
  <line x1="250" y1="48" x2="250" y2="452" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="48" y1="250" x2="452" y2="250" stroke="#1a1a1a" stroke-width="4"/>

  <!-- TOP-LEFT: PSBC 2009 -->
  <text x="148" y="198" font-family="Arial Black, Impact, sans-serif" font-weight="900"
    font-size="44" fill="#1a1a1a" text-anchor="middle" letter-spacing="-1">PSBC</text>
  <text x="148" y="240" font-family="Arial, sans-serif" font-weight="700"
    font-size="28" fill="#1a1a1a" text-anchor="middle">2009</text>

  <!-- TOP-RIGHT: Key -->
  <g transform="translate(352,185)">
    <!-- Key bow (circular part) -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#1a1a1a" stroke-width="8"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#1a1a1a" stroke-width="6"/>
    <!-- Key shaft -->
    <rect x="33" y="-7" width="72" height="14" fill="#1a1a1a" rx="3"/>
    <!-- Key teeth -->
    <rect x="75" y="7" width="10" height="18" fill="#1a1a1a" rx="2"/>
    <rect x="90" y="7" width="10" height="14" fill="#1a1a1a" rx="2"/>
    <rect x="105" y="7" width="8" height="20" fill="#1a1a1a" rx="2"/>
  </g>

  <!-- BOTTOM-LEFT: Atom -->
  <g transform="translate(148,352)">
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="14" fill="#DC2626"/>
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="55" ry="20" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="55" ry="20" fill="none" stroke="#1a1a1a" stroke-width="4"
      transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="55" ry="20" fill="none" stroke="#1a1a1a" stroke-width="4"
      transform="rotate(120)"/>
    <!-- Electrons -->
    <circle cx="55" cy="0" r="8" fill="#3B82F6"/>
    <circle cx="-27" cy="47" r="8" fill="#22C55E"/>
    <circle cx="-27" cy="-47" r="8" fill="#F59E0B"/>
  </g>

  <!-- BOTTOM-RIGHT: Building -->
  <g transform="translate(352,345)">
    <!-- Main building body -->
    <rect x="-38" y="-45" width="76" height="72" fill="#D1D5DB" stroke="#6B7280" stroke-width="3" rx="2"/>
    <!-- Roof/top structure -->
    <polygon points="-45,-45 45,-45 38,-70 -38,-70" fill="#9CA3AF" stroke="#6B7280" stroke-width="2.5"/>
    <!-- Windows row 1 -->
    <rect x="-28" y="-35" width="18" height="14" fill="#93C5FD" rx="1"/>
    <rect x="10" y="-35" width="18" height="14" fill="#93C5FD" rx="1"/>
    <!-- Windows row 2 -->
    <rect x="-28" y="-15" width="18" height="14" fill="#93C5FD" rx="1"/>
    <rect x="10" y="-15" width="18" height="14" fill="#93C5FD" rx="1"/>
    <!-- Door -->
    <rect x="-10" y="10" width="20" height="17" fill="#4B5563" rx="1"/>
    <!-- Steps -->
    <rect x="-44" y="26" width="88" height="6" fill="#9CA3AF" rx="1"/>
    <rect x="-50" y="30" width="100" height="6" fill="#9CA3AF" rx="1"/>
    <!-- Roof triangle accent -->
    <polygon points="-10,-60 10,-60 0,-72" fill="#6B7280"/>
  </g>

  <!-- CIRCULAR TEXT - Top arc: "PAETE SCIENCE and BUSINESS COLLEGE INC." -->
  <defs>
    <path id="topTextArc"
      d="M 60,250 A 190,190 0 0,1 440,250"/>
    <path id="bottomTextArc"
      d="M 78,290 A 185,185 0 0,0 422,290"/>
  </defs>

  <!-- Top arc text -->
  <text font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="26" fill="#1a1a1a"
    letter-spacing="1.5">
    <textPath href="#topTextArc" startOffset="2%">
      PAETE SCIENCE and BUSINESS COLLEGE INC.
    </textPath>
  </text>

  <!-- Bottom arc text -->
  <text font-family="Arial Black, sans-serif" font-weight="900" font-size="23" fill="#1a1a1a">
    <textPath href="#bottomTextArc" startOffset="18%">
      ● Paete, Laguna ●
    </textPath>
  </text>
</svg>
