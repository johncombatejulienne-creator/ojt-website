<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="98" fill="white" stroke="#111" stroke-width="3.5"/>
  
  <!-- Inner shield quadrants -->
  <!-- Top-left: Orange - PSBC 2009 -->
  <path d="M100,100 L100,16 A84,84 0 0,0 16,100 Z" fill="#F97316"/>
  <!-- Top-right: Yellow - Key -->
  <path d="M100,100 L100,16 A84,84 0 0,1 184,100 Z" fill="#FCD34D"/>
  <!-- Bottom-left: Yellow - Atom -->
  <path d="M100,100 L184,100 A84,84 0 0,1 100,184 Z" fill="#FCD34D"/>
  <!-- Bottom-right: Yellow - Building -->
  <path d="M100,100 L16,100 A84,84 0 0,1 100,184 Z" fill="#FBBF24"/>

  <!-- Dividers -->
  <line x1="100" y1="16" x2="100" y2="184" stroke="#111" stroke-width="2"/>
  <line x1="16" y1="100" x2="184" y2="100" stroke="#111" stroke-width="2"/>

  <!-- PSBC 2009 text (top-left) -->
  <text x="58" y="88" font-family="Arial Black, sans-serif" font-weight="900" font-size="18" fill="#111" text-anchor="middle">PSBC</text>
  <text x="58" y="108" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#111" text-anchor="middle">2009</text>

  <!-- Key (top-right) -->
  <g transform="translate(142,85)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#111" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#111" stroke-width="2"/>
    <line x1="12" y1="0" x2="30" y2="0" stroke="#111" stroke-width="2.5"/>
    <line x1="24" y1="0" x2="24" y2="6" stroke="#111" stroke-width="2"/>
    <line x1="28" y1="0" x2="28" y2="5" stroke="#111" stroke-width="2"/>
  </g>

  <!-- Atom (bottom-left) -->
  <g transform="translate(58,148)">
    <ellipse cx="0" cy="0" rx="18" ry="7" fill="none" stroke="#333" stroke-width="1.8"/>
    <ellipse cx="0" cy="0" rx="18" ry="7" fill="none" stroke="#333" stroke-width="1.8" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="18" ry="7" fill="none" stroke="#333" stroke-width="1.8" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="4" fill="#EF4444"/>
    <circle cx="18" cy="0" r="3" fill="#3B82F6"/>
    <circle cx="-9" cy="15" r="3" fill="#22C55E"/>
  </g>

  <!-- Building (bottom-right) -->
  <g transform="translate(130,135)">
    <rect x="-12" y="-18" width="24" height="28" fill="#D1D5DB" stroke="#6B7280" stroke-width="1"/>
    <rect x="-8" y="-10" width="6" height="8" fill="#93C5FD"/>
    <rect x="2" y="-10" width="6" height="8" fill="#93C5FD"/>
    <rect x="-4" y="2" width="8" height="8" fill="#6B7280"/>
    <polygon points="-16,-18 16,-18 12,-28 -12,-28" fill="#9CA3AF" stroke="#6B7280" stroke-width="1"/>
  </g>

  <!-- Circular text - "PAETE SCIENCE and BUSINESS COLLEGE INC." -->
  <defs>
    <path id="topArc" d="M 22,100 A 78,78 0 0,1 178,100"/>
    <path id="bottomArc" d="M 30,115 A 78,78 0 0,0 170,115"/>
  </defs>
  <text font-family="Arial Black, sans-serif" font-weight="900" font-size="11.5" fill="#111">
    <textPath href="#topArc" startOffset="3%">PAETE SCIENCE and BUSINESS COLLEGE INC.</textPath>
  </text>

  <!-- Bottom text -->
  <text x="100" y="174" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#111" text-anchor="middle">● Paete, Laguna ●</text>
</svg>
